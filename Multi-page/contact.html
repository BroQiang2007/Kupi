<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <title>KUPI - Contact</title>
  <style>
    :root { --dark: #0D1310; --brown: #A36939; --bg: #F9F8F6; }
    * { margin:0; padding:0; box-sizing:border-box; font-family:sans-serif; }
    body { background: var(--bg); color: var(--dark); }
    header { background: var(--dark); padding: 20px 8%; display: flex; justify-content: space-between; align-items: center; }
    .logo { color: #FFF; font-size: 24px; font-weight: bold; }
    .logo span { color: var(--brown); }
    nav a { color: #FFF; text-decoration: none; margin-left: 20px; }
    nav a.active { color: var(--brown); font-weight: bold; }
    .container { padding: 40px 8%; display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
    input, textarea { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; }
    button { background: var(--brown); color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>

  <header>
    <div class="logo">KUPI<span>.</span></div>
    <nav>
      <a href="index.html">Home</a>
      <a href="menu.html">Menu</a>
      <a href="profile.html">Profile</a>
      <a href="contact.html" class="active">Contact</a>
    </nav>
  </header>

  <div class="container">
    <div>
      <h2>Hubungi Kami</h2>
      <form>
        <input type="text" placeholder="Nama" required>
        <input type="email" placeholder="Emel" required>
        <textarea rows="4" placeholder="Mesej Pertanyaan"></textarea>
        <button type="submit">Hantar</button>
      </form>
    </div>
    <div>
      <h2>Maklumat Syarikat</h2>
      <p><strong>Alamat:</strong> No. 12, Jalan Moden 1, Cyberjaya</p>
      <p><strong>Telefon:</strong> +60 12-345 6789</p>
      <br>
      <p><a href="https://maps.google.com" target="_blank" style="color:var(--brown);">Pautan ke Google Maps &rarr;</a></p>
    </div>
  </div>

</body>
</html>
