<!DOCTYPE html>
<html lang="ms">

    .container { padding: 60px 8%; text-align: center; }
    .promo { background: var(--green); color: white; display: inline-block; padding: 6px 16px; border-radius: 20px; font-size: 14px; margin-bottom: 20px; }
    h1 { font-size: 40px; margin-bottom: 15px; }
    p { color: #666; max-width: 600px; margin: 0 auto 30px; }
    .btn { background: var(--brown); color: white; padding: 12px 28px; text-decoration: none; border-radius: 6px; font-weight: bold; }
  </style>
</head>
<body>

  <header>

</html>
